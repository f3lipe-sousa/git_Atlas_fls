<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07090d" id="meta-theme">
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Atlas — Painel Financeiro</title>
<script>
(function(){try{var t=localStorage.getItem("atlas-theme");if(t==="graphite"||t==="pearl"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}})();
</script>
<style>
:root{
  --bg:#07090d;--panel:#10151d;--panel2:#141a24;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --text:#eef1f5;--muted:#8a94a6;--soft:#c3cad6;--nav-label:#5d6778;
  --teal:#3ee6b5;--gold:#e6c587;--red:#ff7a85;--blue:#8ab4ff;
  --card1:rgba(22,28,38,.9);--card2:rgba(14,18,25,.9);
  --side1:rgba(16,21,29,.85);--side2:rgba(10,13,18,.85);
  --sel-base:#141a24;--sel-end:#0e1219;
  --modal1:#171e29;--modal2:#0f141b;
  --input:rgba(0,0,0,.3);--tint:rgba(255,255,255,.03);--tint2:rgba(255,255,255,.06);--chip-bg:rgba(0,0,0,.25);
  --scroll:#1f2733;--glow1:rgba(62,230,181,.09);--glow2:rgba(230,197,135,.06);
  --accent-grad:linear-gradient(135deg,#6ff3cc,#22c495);--on-accent:#04140f;
  --chart-grid:#263640;--chart-axis:#80939f;--chart-total:#edf3f6;--chart-dot:#14232b;
  --picker:invert(1);--scheme:dark;
  --radius:18px;--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 20px 50px -20px rgba(0,0,0,.7);
  --ease:cubic-bezier(.2,.8,.2,1)
}
[data-theme="graphite"]{
  --bg:#1a1f27;--panel:#222833;--panel2:#272e3a;
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --text:#f1f3f6;--muted:#9aa4b5;--soft:#cfd5df;--nav-label:#7a8496;
  --teal:#4fd8b0;--gold:#e3c48c;--red:#ff8a93;--blue:#9dbcff;
  --card1:rgba(42,49,61,.92);--card2:rgba(32,38,48,.92);
  --side1:rgba(36,42,53,.92);--side2:rgba(28,33,42,.92);
  --sel-base:#2a313d;--sel-end:#20262f;
  --modal1:#2a313d;--modal2:#20262f;
  --input:rgba(0,0,0,.2);--tint:rgba(255,255,255,.035);--tint2:rgba(255,255,255,.07);--chip-bg:rgba(0,0,0,.18);
  --scroll:#3a4352;--glow1:rgba(79,216,176,.08);--glow2:rgba(227,196,140,.06);
  --chart-grid:#3a4352;--chart-axis:#9aa4b5;--chart-total:#f1f3f6;--chart-dot:#222833;
  --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 20px 45px -22px rgba(0,0,0,.55)
}
[data-theme="pearl"]{
  --bg:#f5f2ec;--panel:#ffffff;--panel2:#f7f4ee;
  --line:rgba(28,32,40,.08);--line2:rgba(28,32,40,.14);
  --text:#1a1f29;--muted:#6b7280;--soft:#3f4653;--nav-label:#9aa0aa;
  --teal:#0e9f7a;--gold:#a87a2c;--red:#d64555;--blue:#3b6fd8;
  --card1:rgba(255,255,255,.96);--card2:rgba(251,249,245,.96);
  --side1:rgba(255,255,255,.88);--side2:rgba(249,246,240,.88);
  --sel-base:#ffffff;--sel-end:#faf7f1;
  --modal1:#ffffff;--modal2:#f8f5ef;
  --input:#ffffff;--tint:rgba(28,32,40,.03);--tint2:rgba(28,32,40,.06);--chip-bg:rgba(28,32,40,.04);
  --scroll:#d6d0c4;--glow1:rgba(14,159,122,.07);--glow2:rgba(168,122,44,.07);
  --accent-grad:linear-gradient(135deg,#17b98e,#0b8566);--on-accent:#ffffff;
  --chart-grid:#e8e3da;--chart-axis:#8a8f98;--chart-total:#1a1f29;--chart-dot:#ffffff;
  --picker:none;--scheme:light;
  --shadow:0 1px 0 rgba(255,255,255,.8) inset,0 18px 40px -24px rgba(60,50,30,.28)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--text);font:14px/1.55 Inter,ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background-color .3s,color .3s;
  background:radial-gradient(900px 500px at 85% -10%,var(--glow1),transparent 60%),radial-gradient(700px 400px at 0% 100%,var(--glow2),transparent 60%),var(--bg);background-attachment:fixed}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:8px}
.num,.metric-value,.scope-card-value,.legend-value,.subarea-bar-value,td.money,.goal-card-value,.goal-kpi strong{font-variant-numeric:tabular-nums}

/* ===== Shell ===== */
.shell{min-height:100vh;display:grid;grid-template-columns:248px minmax(0,1fr);transition:grid-template-columns .3s var(--ease)}
aside{position:sticky;top:0;height:100vh;padding:22px 14px;display:flex;flex-direction:column;gap:26px;min-width:0;z-index:10;
  background:linear-gradient(180deg,var(--side1),var(--side2));backdrop-filter:blur(18px);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px;min-height:42px}
.brand-mark{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;font-weight:800;font-size:18px;color:#04140f;
  background:linear-gradient(140deg,#7ff5d2,#1fb58a 55%,#c9a86a);box-shadow:0 10px 30px -8px rgba(62,230,181,.55)}
.brand-name{font-weight:800;letter-spacing:.22em;font-size:14px}
.brand-sub{font-size:10px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.sidebar-toggle{margin-left:auto;width:30px;height:30px;flex:none;border:1px solid var(--line2);background:transparent;border-radius:9px;color:var(--muted);transition:.2s}
.sidebar-toggle:hover{color:var(--text);border-color:var(--teal)}
.nav-label{font-size:10px;color:var(--nav-label);text-transform:uppercase;letter-spacing:.18em;padding:0 12px;margin-bottom:8px;white-space:nowrap}
.nav{display:grid;gap:4px}
.nav button{position:relative;display:flex;align-items:center;gap:12px;min-height:44px;padding:10px 12px;border:0;border-radius:12px;background:transparent;color:var(--muted);text-align:left;white-space:nowrap;overflow:hidden;font-weight:500;transition:.2s var(--ease)}
.nav button:hover{background:var(--tint2);color:var(--text)}
.nav button.active{background:linear-gradient(90deg,color-mix(in srgb,var(--teal) 16%,transparent),color-mix(in srgb,var(--teal) 2%,transparent));color:var(--text)}
.nav button.active::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--teal);box-shadow:0 0 12px var(--teal)}
.nav .data-toggle{display:none}
.shell.data-open .nav .data-toggle{background:var(--tint2);color:var(--text)}
.nav-icon{font-size:17px;width:22px;text-align:center;flex:none}
.side-bottom{margin-top:auto;display:grid;gap:6px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--tint)}
.side-bottom strong{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.side-bottom .btn{width:100%;justify-content:flex-start}
.side-sep{height:1px;background:var(--line);margin:8px 0 4px}
.theme-switch{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.theme-opt{display:grid;justify-items:center;gap:5px;padding:8px 4px;border:1px solid var(--line2);border-radius:11px;background:transparent;font-size:10px;font-weight:600;color:var(--muted);transition:.2s var(--ease)}
.theme-opt:hover{color:var(--text);border-color:color-mix(in srgb,var(--teal) 50%,transparent)}
.theme-opt.active{color:var(--text);border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 15%,transparent)}
.theme-swatch{width:22px;height:22px;border-radius:50%;border:1px solid rgba(128,128,128,.35)}
.sw-dark{background:linear-gradient(135deg,#07090d 50%,#3ee6b5 50%)}
.sw-graphite{background:linear-gradient(135deg,#2a313d 50%,#4fd8b0 50%)}
.sw-pearl{background:linear-gradient(135deg,#f5f2ec 50%,#0e9f7a 50%)}

/* ===== Main ===== */
main{padding:30px clamp(18px,3vw,48px) 48px;max-width:1680px;width:100%;margin:0 auto;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:24px}
.eyebrow{color:var(--teal);text-transform:uppercase;letter-spacing:.2em;font-size:10px;font-weight:700}
h1{font-size:clamp(22px,2.4vw,30px);font-weight:700;letter-spacing:-.03em;margin:6px 0 0;line-height:1.15;text-transform:capitalize}
.top-actions{display:flex;gap:8px;align-items:center}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--tint);padding:10px 15px;border-radius:12px;font-size:12px;font-weight:600;transition:.2s var(--ease)}
.btn:hover{background:var(--tint2);border-color:color-mix(in srgb,var(--text) 22%,transparent)}
.btn.primary{border:0;color:var(--on-accent);background:var(--accent-grad);box-shadow:0 10px 28px -10px color-mix(in srgb,var(--teal) 70%,transparent)}
.btn.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.danger{color:var(--red)}.btn.danger:hover{border-color:color-mix(in srgb,var(--red) 50%,transparent);background:color-mix(in srgb,var(--red) 8%,transparent)}
.btn.small{padding:7px 11px;font-size:11px;border-radius:10px}
.screen{display:none;animation:fade .35s var(--ease)}.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== Cards ===== */
.card{background:linear-gradient(160deg,var(--card1),var(--card2));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);backdrop-filter:blur(10px)}
.panel{padding:20px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.panel-title{font-size:14px;font-weight:700;letter-spacing:-.01em;margin:0}
.panel-sub{color:var(--muted);font-size:11.5px;margin:4px 0 0}

/* Scope cards */
.scope-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px;margin-bottom:16px}
.scope-card{--area-color:var(--teal);position:relative;min-height:78px;padding:15px 16px;text-align:left;border:1px solid var(--line);border-radius:16px;background:linear-gradient(160deg,var(--card1),var(--card2));box-shadow:var(--shadow);transition:.25s var(--ease);overflow:hidden}
.scope-card::after{content:"";position:absolute;inset:auto -30% -60% auto;width:120px;height:120px;border-radius:50%;background:var(--area-color);opacity:0;filter:blur(40px);transition:.3s}
.scope-card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--area-color) 50%,transparent)}
.scope-card.selected{border-color:color-mix(in srgb,var(--area-color) 70%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--area-color) 14%,var(--sel-base)),var(--sel-end))}
.scope-card.selected::after{opacity:.25}
.scope-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.scope-card-name{font-size:12.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scope-card-mark{width:9px;height:9px;border-radius:50%;background:var(--area-color);box-shadow:0 0 10px var(--area-color);flex:none}
.scope-card-value{font-size:18px;font-weight:700;margin-top:10px;white-space:nowrap}
.scope-card-foot{display:flex;justify-content:space-between;margin-top:6px;color:var(--muted);font-size:11px}
.scope-card-action{position:absolute;right:12px;bottom:11px;z-index:1;padding:4px 8px;border-radius:8px;border:1px solid var(--line2);background:var(--chip-bg);font-size:10px;font-weight:700;letter-spacing:.06em;transition:.2s}
.scope-card-action:hover{color:var(--area-color);border-color:var(--area-color)}

/* Metrics */
.summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:16px}
.metric{padding:20px 22px;min-height:124px;position:relative;overflow:hidden}
.metric::before{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--teal) 16%,transparent),transparent 70%)}
.metric:nth-child(2)::before{background:radial-gradient(circle,color-mix(in srgb,var(--gold) 16%,transparent),transparent 70%)}
.metric-label{color:var(--muted);font-size:11.5px;font-weight:500}
.metric-value{font-size:clamp(24px,2.4vw,34px);font-weight:750;letter-spacing:-.035em;margin:10px 0 4px}
.metric-foot{font-size:11px;color:var(--soft)}
.metric-mark{float:right;font-size:18px;color:var(--teal)}.metric:nth-child(2) .metric-mark{color:var(--gold)}

/* Layout */
.layout-main{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(320px,.9fr);gap:16px;margin-bottom:16px}
.chart-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#period-tools{padding:3px;border:1px solid var(--line);border-radius:11px;background:var(--chip-bg);gap:2px}
.chip{border:0;background:transparent;color:var(--muted);border-radius:8px;padding:6px 11px;font-size:11px;font-weight:600;transition:.2s}
.chip:hover{color:var(--text)}.chip.active{background:var(--teal);color:var(--on-accent)}
.chart-select{border:1px solid var(--line);background:var(--chip-bg);border-radius:10px;padding:7px 10px;font-size:11px;max-width:180px;outline:0;color-scheme:var(--scheme)}
.chart-select option{background:var(--panel)}
.chart-wrap{height:300px;position:relative}
svg.chart{width:100%;height:100%;overflow:visible;display:block}
.chart-empty{height:100%;min-height:140px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:12px;padding:20px}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.chart-legend-item{display:flex;align-items:center;gap:7px;color:var(--soft);font-size:11px}
.chart-legend-line{height:3px;width:16px;border-radius:4px}
.goal-legend-line{height:0;width:16px;border-top:2px dashed var(--gold)}

/* Donut */
.donut-layout{display:grid;grid-template-columns:160px minmax(0,1fr);align-items:center;gap:18px;min-height:220px}
.donut{width:160px;height:160px;position:relative;border-radius:50%;filter:drop-shadow(0 10px 25px rgba(0,0,0,.25))}
.donut-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut-center strong{font-size:19px;letter-spacing:-.03em}.donut-center span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.legend{display:grid;gap:10px;max-height:240px;overflow:auto;padding-right:4px}
.legend-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.legend-name{display:flex;gap:8px;align-items:center;color:var(--soft);min-width:0}.legend-name span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend-value{text-align:right;white-space:nowrap}.legend-value small{display:block;color:var(--muted);font-size:10px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}

/* Subárea bars */
.subarea-panel,.goal-panel{margin-bottom:16px}
.subarea-bars{display:grid;gap:18px;max-height:420px;overflow:auto;padding-right:4px}
.subarea-group{display:grid;gap:9px}
.subarea-group-title{display:flex;justify-content:space-between;font-size:12px;font-weight:650;padding-bottom:7px;border-bottom:1px solid var(--line)}
.subarea-bar-row{display:grid;grid-template-columns:minmax(110px,200px) minmax(50px,1fr) minmax(90px,130px);gap:12px;align-items:center;font-size:11.5px}
.subarea-bar-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--soft)}
.subarea-bar-track{height:8px;background:var(--tint2);border-radius:10px;overflow:hidden}
.subarea-bar-fill{height:100%;border-radius:10px;transition:width .6s var(--ease)}
.subarea-bar-value{text-align:right;white-space:nowrap}

/* Goals */
.goal-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.goal-card{--area-color:var(--teal);padding:16px;text-align:left;border:1px solid var(--line);border-radius:16px;background:var(--tint);transition:.25s var(--ease);min-width:0}
.goal-card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--area-color) 60%,transparent)}
.goal-card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;font-weight:650}
.goal-card-head span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal-card-value{font-size:18px;font-weight:750;margin:12px 0 2px}
.goal-card-meta,.goal-card-empty{color:var(--muted);font-size:11px}.goal-card-empty{margin-top:12px}
